name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ========================================
  # Job 1: Build Validation (CI)
  # Runs on every push and pull request to ensure build correctness
  # ========================================
  validate:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            shop-backend/package-lock.json
            shop-frontend/package-lock.json

      - name: Validate Backend Build
        run: |
          cd shop-backend
          npm install
          npm run build

      - name: Validate Frontend Build
        run: |
          cd shop-frontend
          npm install
          npm run build

  # ========================================
  # Job 2: Cloud Auto-Deploy (Render & Vercel)
  # Triggers deployment webhooks on successful main branch pushes
  # ========================================
  deploy-cloud:
    name: Deploy to Cloud (Render & Vercel)
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger Render Backend Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deployment..."
          curl -sS "${{ env.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered successfully!"

      - name: Trigger Vercel Frontend Deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Vercel deployment..."
          curl -X POST -sS "${{ env.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Vercel deployment triggered successfully!"

  # ========================================
  # Job 3: Deploy to Local Docker (Option)
  # Uses self-hosted runner installed on your machine
  # ========================================
  deploy-local:
    name: Deploy to Local Docker
    needs: validate
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.USE_LOCAL_DOCKER == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy
        shell: bash
        run: |
          docker compose build --no-cache
          docker compose up -d
          echo "Waiting for services to start..."
          sleep 10
          docker compose exec -T backend npx prisma migrate deploy
          docker compose ps
          echo "Deployment complete!"

  # ========================================
  # Job 4: Deploy to Remote Server (Option)
  # Uses SSH to connect to a remote server
  # ========================================
  deploy-remote:
    name: Deploy to Remote Server
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.USE_REMOTE_SERVER == 'true' && !vars.USE_CLOUD_DEPLOY

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: >-
            docker-compose.yml,
            shop-backend/,
            shop-frontend/,
            nginx/
          target: ~/sh-shop

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/sh-shop

            cat > .env << 'ENVEOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_FACEBOOK_APP_ID=${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }}
            FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            ENVEOF

            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "Waiting for services..."
            sleep 10

            docker compose exec -T backend npx prisma migrate deploy
            docker compose ps
            echo "Deployment complete!"

